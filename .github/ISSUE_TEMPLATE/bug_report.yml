name: 🐛 Bug 报告
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题。请尽量填完下面各项——**能复现的 bug 修得最快**。

        提交前请先搜索[已有 Issue](https://github.com/bear4f/routetune/issues?q=is%3Aissue)，避免重复。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清晰说明发生了什么。
      placeholder: 调用 X 时程序退出，没有任何错误输出。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 让别人能照着复现出同样结果的最小步骤。
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的结果应该是什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错栈
      description: 粘贴相关日志或完整错误堆栈。会自动按代码块渲染，无需加反引号。
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      value: |
        - 操作系统：
        - 运行时版本：
        - routetune 版本 / commit：
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、相关 Issue、你已经尝试过的排查等。

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，确认没有重复
          required: true
        - label: 我使用的是最新版本 / `main` 分支
          required: false
