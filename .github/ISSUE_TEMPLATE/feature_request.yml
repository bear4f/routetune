name: ✨ 功能建议
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述你遇到的**问题**，再描述你想要的方案——问题说清楚了，往往会出现更好的解法。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下卡住了？现在只能怎么绕过？
      placeholder: 我想做 X 的时候，只能……，很麻烦，因为……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？有 API 设想的话请写出来。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 你评估过哪些替代做法？为什么不够好？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 小改动（局部、向后兼容）
        - 中等（新增模块或接口）
        - 大改动（可能有破坏性变更）
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 来实现这个功能
          required: false
