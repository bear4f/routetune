version: 2
updates:
  # GitHub Actions —— 无论技术栈如何都适用
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci

  # ↓ 技术栈确定后，取消对应块的注释即可。
