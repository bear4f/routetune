name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: 探测技术栈
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      python: ${{ steps.check.outputs.python }}
      go: ${{ steps.check.outputs.go }}
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: 检测依赖清单文件
        run: |
          set -euo pipefail
          anyf() {
            for f in "$@"; do
              if [ -f "$f" ]; then echo true; return; fi
            done
            echo false
          }
          {
            echo "node=$(anyf package.json)"
            echo "python=$(anyf pyproject.toml requirements.txt setup.py setup.cfg)"
            echo "go=$(anyf go.mod)"
            echo "rust=$(anyf Cargo.toml)"
          } | tee -a "$GITHUB_OUTPUT"

  node:
    name: Node ${{ matrix.node-version }}
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - id: pm
        name: 识别包管理器
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"; echo "cache=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"; echo "cache=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "name=npm" >> "$GITHUB_OUTPUT"; echo "cache=npm" >> "$GITHUB_OUTPUT"
          else
            # 没有 lockfile 时不能开缓存，否则 setup-node 会直接报错
            echo "name=npm" >> "$GITHUB_OUTPUT"; echo "cache=" >> "$GITHUB_OUTPUT"
          fi

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ steps.pm.outputs.cache }}

      - name: 安装依赖
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.name }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable || yarn install --frozen-lockfile ;;
            npm)  if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
          esac

      - name: 检查 / 类型 / 测试
        run: |
          set -euo pipefail
          PM="${{ steps.pm.outputs.name }}"
          has_script() {
            node -e "const s=(require('./package.json').scripts)||{};process.exit(s['$1']?0:1)"
          }
          run_script() {
            case "$PM" in
              pnpm) pnpm run "$1" ;;
              yarn) yarn run "$1" ;;
              npm)  npm run "$1" ;;
            esac
          }
          for s in lint typecheck build test; do
            if has_script "$s"; then
              echo "::group::$PM run $s"
              run_script "$s"
              echo "::endgroup::"
            else
              echo "跳过 $s（package.json 中未定义该脚本）"
            fi
          done

  python:
    name: Python ${{ matrix.python-version }}
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e . || true
          fi
          pip install ruff pytest

      - name: ruff 检查
        run: |
          ruff check .
          ruff format --check .

      - name: pytest
        run: |
          set -euo pipefail
          if compgen -G "test_*.py" > /dev/null || compgen -G "tests" > /dev/null || compgen -G "**/test_*.py" > /dev/null; then
            pytest -q
          else
            echo "跳过 pytest（未发现测试）"
          fi
        shell: bash

  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt 检查
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w ："
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...

  rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  ci-ok:
    name: CI 通过
    if: always()
    needs: [detect, node, python, go, rust]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总各任务结果
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "各任务结果：$results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "存在未通过的任务（$r）"; exit 1 ;;
            esac
          done
          echo "全部通过。"
