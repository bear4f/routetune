name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Bash 语法、ShellCheck 与回归测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash 语法
        run: bash -n routetune.sh tests/self-test.sh

      - name: ShellCheck
        run: shellcheck routetune.sh tests/self-test.sh

      - name: 自测
        run: bash tests/self-test.sh
